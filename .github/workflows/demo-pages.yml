name: Publish static demo
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'demo/**'
      - 'public/**'
      - 'scripts/build-demo.mjs'
      - 'scripts/test-popup.mjs'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/demo-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: demo-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:popup
      - run: npm run test:notifications
      - run: npm run build:demo
        env:
          DEMO_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Keep the generated demo in gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add --detach "$RUNNER_TEMP/demo-branch" origin/gh-pages
          else
            git worktree add --detach "$RUNNER_TEMP/demo-branch" HEAD
            git -C "$RUNNER_TEMP/demo-branch" checkout --orphan gh-pages
            git -C "$RUNNER_TEMP/demo-branch" rm -rf .
          fi
          rsync -a --delete --exclude=.git dist-demo/ "$RUNNER_TEMP/demo-branch/"
          git -C "$RUNNER_TEMP/demo-branch" add -A
          if ! git -C "$RUNNER_TEMP/demo-branch" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/demo-branch" commit -m "Publish static demo from $GITHUB_SHA"
            git -C "$RUNNER_TEMP/demo-branch" push origin HEAD:gh-pages
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
